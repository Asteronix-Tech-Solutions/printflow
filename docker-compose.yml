version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pintflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pintflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pintflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: pintflow_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_DRIVER: "postgres"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/pintflow?sslmode=disable"
      WEBHOOK_SECRET: "pintflow_secret_token_123"
      DEFAULT_PRINTER: "Brother_DCP_T430W"
      PRINTER_TYPE: "ipp" # "ipp", "cups", "mock"
      PRINTER_ADDRESS: "192.168.1.100:9100" # Update with your printer IP address
      GOOGLE_CREDENTIALS_FILE: "/app/storage/credentials.json"
      TEMP_DIR: "/app/storage/temp"
      ARCHIVE_DIR: "/app/storage/archive"
      LOG_DIR: "/app/storage/logs"
      MAX_CONCURRENT_JOBS: "3"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: pintflow_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      - backend

volumes:
  postgres-data:
